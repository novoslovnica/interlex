name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # SQLite DB files are gitignored (real production data, never committed -
      # see AGENTS.md) - these steps only generate the Prisma client code from
      # the schema files, no database file is required for that.
      - run: npm run db:gen-auth
      - run: npm run db:gen-data
      - run: npm run db:gen-library
      - run: npm run db:gen-corpus

      # Both gates are ratchets over pre-existing debt (see
      # scripts/ci/check-baseline.mjs): they fail on any error that isn't
      # already in scripts/ci/baselines/, not on the old ones.
      - run: npm run lint:gate

      # tsconfig.ci.json exists because the main tsconfig.json pairs
      # module=nodenext with moduleResolution=bundler, which the tsc CLI
      # rejects (TS5095) even though Next's own type-checker accepts it.
      - run: npm run typecheck:gate

      - run: npm run test:run

      - run: npm run build
        env:
          AUTH_SECRET: ci-placeholder-secret
